# ACE - HP server (Windows Server + Docker Desktop, Linux containers)
#
#   docker compose up -d --build        start / update
#   docker compose logs -f ace          follow logs
#
# ACE signs in to the Synology Drive NAS (AA-RS) itself over SMB as the `ace`
# account - like a staff PC - so no Windows drive mapping or Docker volume is
# involved. What ACE can see is controlled entirely by that account's DSM
# permissions. All values come from .env (see .env.example).
name: ace

services:
  ace:
    build: .
    image: ace:0.8.0
    container_name: ace
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      LOG_DIR: /data/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"   # TallyPrime runs on this HP server (port 9000)
    ports:
      - "${ACE_PORT:-8080}:8080"
    volumes:
      - ./logs:/data/logs                # audit + service logs, local on the HP server
      - ./state:/data/state              # what ACE has already handled (channel watcher)
      - ./skills:/app/skills:ro          # skill changes need only `docker compose restart ace`
      - ./config:/app/config:ro
