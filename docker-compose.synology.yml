# ACE - ALTERNATIVE deployment: Synology Container Manager project
# (the main deployment is the HP server - see docker-compose.yml)
# Use with: docker compose -f docker-compose.synology.yml up -d --build
# Place this repo at /volume1/docker/ace and create a Project pointing to it.
name: ace

services:
  ace:
    build: .
    image: ace:0.7.2
    container_name: ace
    restart: unless-stopped
    env_file: .env
    user: "${PUID:-1026}:${PGID:-100}"
    ports:
      - "8080:8080"
    volumes:
      # Synology Drive shared folder: put TB/input files in inbox, reports appear in reports
      - /volume1/ACE/inbox:/data/inbox:ro
      - /volume1/ACE/reports:/data/reports
      - /volume1/ACE/logs:/data/logs
      # Skills and employee config are mounted so skill updates only need a restart
      - ./skills:/app/skills:ro
      - ./config:/app/config:ro
